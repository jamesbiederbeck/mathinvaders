name: build

# Every push and pull request builds an APK and uploads it as an artifact.
# A push to main that changes versionName (i.e. no v<versionName>#N tag exists
# yet) also publishes a release tagged v<versionName>#<N>, where N is the
# highest N among existing v*#N tags plus one. N is the APK's versionCode, so
# every release installs as an update over the previous one. Bump versionName
# in AndroidManifest.xml to cut a release; other pushes only build.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create the tag and release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORM: android-33
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # need the v*#N tags

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Version
        id: version
        run: |
          name=$(grep -oP 'android:versionName="\K[^"]+' AndroidManifest.xml)
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName '$name' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          last=$(git tag -l 'v*#*' | sed 's/.*#//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          code=$(( ${last:-0} + 1 ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name#$code" >> "$GITHUB_OUTPUT"
          echo "Version $name, versionCode $code"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" > /dev/null
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"

      # debug.keystore is gitignored. With the KEYSTORE_BASE64 secret set (the
      # development machine's debug.keystore, base64) CI builds are signed with
      # the same key and install over local builds and over each other.
      # Without it each run signs with a throwaway key, and its APK needs the
      # previous install removed first.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            make keystore
            echo "::warning::No KEYSTORE_BASE64 secret: signed with a throwaway key"
          fi

      - name: Build APK
        run: |
          make \
            ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar" \
            AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" \
            VERSION_CODE=${{ steps.version.outputs.code }}
          cp aligned.apk "mathinvaders-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: mathinvaders-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-apk
          path: mathinvaders-*.apk
          if-no-files-found: error

      - name: Release ${{ steps.version.outputs.tag }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -n "$(git tag -l "v$NAME#*")" ]; then
            echo "A v$NAME#N release already exists; bump versionName to publish a new one."
            exit 0
          fi
          gh release create "$TAG" "mathinvaders-$NAME-$CODE.apk" \
            --target "$GITHUB_SHA" \
            --title "Math Invaders $NAME (#$CODE)" \
            --generate-notes
